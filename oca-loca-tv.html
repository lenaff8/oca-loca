<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🪿 La Oca Loca — TV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}
.screen{display:none;padding:20px;max-width:1400px;width:100%;margin:0 auto;box-sizing:border-box}.screen.active{display:block}
.card{background:var(--panel);border:1px solid var(--wood);border-radius:16px;padding:18px}
.btn{border:none;border-radius:12px;font-weight:900;cursor:pointer;font-family:inherit;transition:transform .12s,opacity .15s}
.btn:hover{opacity:.9;transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn-gold{background:var(--gold);color:var(--gold-text);padding:14px 28px;font-size:16px;box-shadow:0 4px 18px rgba(var(--glow),.35)}
.btn-back{background:var(--btn-ghost-bg);color:var(--btn-ghost-color);padding:10px 18px;font-size:13px;border:1px solid var(--btn-ghost-border)}
.code{font-size:clamp(1.8rem,6vw,3.2rem);font-weight:900;letter-spacing:.08em;color:var(--gold);text-align:center;line-height:1.1;text-shadow:0 0 24px rgba(var(--glow),.4);white-space:nowrap;overflow:hidden}
.label{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--dim);margin-bottom:6px}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--chip-bg);border-radius:9px;padding:6px 12px;margin:3px;font-size:13px;animation:popIn .3s ease both}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.role-row{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--row-bg);border-radius:9px;margin-bottom:4px;font-size:13px;animation:slideIn .35s ease both}
@keyframes slideIn{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}
.status{font-size:11px;color:var(--status-color);text-align:center;margin-top:4px}
.grid2{display:grid;gap:18px;margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
@media(min-width:900px){.gridLobby{grid-template-columns:minmax(320px,38%) 1fr;max-height:calc(100dvh - 56px);align-items:start}.gridLobby>div:first-child{max-height:calc(100dvh - 56px);overflow-y:auto;padding-right:6px}.gridGame{grid-template-columns:minmax(300px,32%) 1fr}}
@media(min-width:1600px){
  body{font-size:1.2rem}
  .screen{max-width:2000px}
  .gridLobby{grid-template-columns:minmax(360px,30%) 1fr;gap:24px}
  .gridGame{grid-template-columns:minmax(340px,26%) 1fr;gap:24px}
  .code{font-size:3.2rem!important}
  .label{font-size:.9rem!important}
  #qrBox img{width:min(30vh,300px)!important;height:min(30vh,300px)!important}
}
@media(min-width:2400px){
  body{font-size:1.5rem}
  .screen{max-width:2800px}
  .code{font-size:4.2rem!important}
  #qrBox img{width:min(28vh,320px)!important;height:min(28vh,320px)!important}
}

/* ── Wizard ── */
.wizard-q{font-size:24px;font-weight:900;color:var(--text);text-align:center;margin-bottom:24px;animation:fadeUp .35s ease both}
@keyframes fadeUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.cat-card{position:relative;border:none;border-radius:20px;padding:clamp(16px,3vh,40px) 20px;cursor:pointer;font-family:inherit;text-align:center;color:#fff;transition:transform .15s,box-shadow .15s;animation:fadeUp .35s ease both;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cat-card:hover{transform:translateY(-4px) scale(1.02)}
.cat-card:active{transform:scale(.97)}
.cat-emoji{font-size:clamp(36px,5vh,64px);display:block;margin-bottom:8px}
.cat-name{font-size:22px;font-weight:900;letter-spacing:.02em}
.cat-sub{font-size:12px;opacity:.65;margin-top:6px;line-height:1.5}
.team-big{border:3px solid transparent;border-radius:18px;padding:28px 14px;cursor:pointer;font-family:inherit;color:#fff;font-size:26px;font-weight:900;transition:transform .12s;min-width:110px;animation:fadeUp .3s ease both}
.team-big:hover{transform:scale(1.06)}.team-big:active{transform:scale(.95)}
.team-big small{display:block;font-size:11px;font-weight:700;opacity:.7;margin-top:4px}

/* ── Slot + roulette + confetti (unchanged visuals) ── */

.slot-window{min-height:66px;overflow:visible;position:relative}
.slot-item{min-height:66px;padding:4px 12px;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,5vw,36px);font-weight:900;color:#fff;text-align:center;line-height:1.3}
@keyframes chPop{0%{transform:scale(.7) rotate(-2deg);opacity:0}60%{transform:scale(1.04) rotate(.5deg)}100%{transform:scale(1) rotate(0)}}
.ch-reveal{animation:chPop .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes glowPulse{0%,100%{box-shadow:0 0 24px rgba(var(--glow),.25)}50%{box-shadow:0 0 48px rgba(var(--glow),.55)}}
.roul-name{padding:12px 22px;border-radius:14px;font-size:22px;font-weight:900;background:var(--chip-bg);border:2px solid transparent;transition:all .08s;color:var(--dim)}
.roul-name.lit{background:var(--gold);color:var(--gold-text);transform:scale(1.12);box-shadow:0 0 36px rgba(var(--glow),.7);border-color:#fff}
.roul-name.winner{background:var(--gold);color:var(--gold-text);transform:scale(1.25);box-shadow:0 0 60px rgba(var(--glow),.95);border-color:#fff;animation:winnerBounce .5s ease 3}
@keyframes winnerBounce{0%,100%{transform:scale(1.25)}50%{transform:scale(1.35)}}
.confetti{position:fixed;width:10px;height:10px;top:-12px;z-index:999;pointer-events:none;animation:confFall linear forwards}
@keyframes confFall{to{transform:translateY(110vh) rotate(720deg)}}


/* ── Theme variables ── */
:root,[data-theme="dark"]{
  --bg:linear-gradient(180deg,#26272b,#1e1f22 70%);
  --panel:#2b2d31;--card:#313338;--text:#dbdee1;--gold:#5865f2;--gold-text:#fff;
  --wood:#3f4147;--dim:#949ba4;--dimmest:rgba(148,155,164,.18);
  --input-bg:#1e1f22;--chip-bg:#383a40;
  --row-bg:#34363c;--btn-ghost-bg:#383a40;
  --btn-ghost-color:#dbdee1;--btn-ghost-border:#4e5058;
  --status-color:#80848e;
  --kick-bg:#3c2022;--kick-color:#fa777c;
  --cat-mini:#3b82f6;--cat-evento:#23a55a;--cat-versus:#da373c;--cat-musical:#e6a817;
  --role-normal:linear-gradient(160deg,#383a40,#2b2d31);
  --role-chosen:linear-gradient(160deg,#4752c4,#36408f);
  --role-secret:linear-gradient(160deg,#6b2350,#2e0f22);
  --role-title:#f2f3f5;--role-desc:rgba(219,222,225,.72);
  --role-label:#8b93f8;--role-secret-label:#ff7ab8;
  --glow:88,101,242;
}
[data-theme="light"]{
  --bg:linear-gradient(180deg,#ffffff,#f0f4f8 80%);
  --panel:#ffffff;--card:#fafcff;--text:#3c3c3c;--gold:#58cc02;--gold-text:#fff;
  --wood:#e5e5e5;--dim:#777777;--dimmest:rgba(60,60,60,.12);
  --input-bg:#f7f7f7;--chip-bg:#eef7ff;
  --row-bg:#f5faff;--btn-ghost-bg:#f0f0f0;
  --btn-ghost-color:#4b4b4b;--btn-ghost-border:#dcdcdc;
  --status-color:#9a9a9a;
  --kick-bg:#ffe3e3;--kick-color:#e21b3c;
  --cat-mini:#1cb0f6;--cat-evento:#22c55e;--cat-versus:#e21b3c;--cat-musical:#f1b000;
  --role-normal:linear-gradient(160deg,#d9f1ff,#bce5ff);
  --role-chosen:linear-gradient(160deg,#fff3b0,#ffd60a);
  --role-secret:linear-gradient(160deg,#f0deff,#dcc0fa);
  --role-title:#1b4965;--role-desc:rgba(27,73,101,.78);
  --role-label:#1899d6;--role-secret-label:#8b5cf6;
  --glow:28,176,246;
}
#themeToggle{
  position:fixed;bottom:14px;left:14px;z-index:200;
  background:var(--panel);border:1px solid var(--wood);
  border-radius:50%;width:40px;height:40px;cursor:pointer;
  font-size:17px;font-family:inherit;color:var(--text);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.25);transition:transform .15s;
}
#themeToggle:hover{transform:scale(1.1)}

/* ── Navegación con mando de TV ── */
*:focus{outline:none}
.tv-focus{outline:4px solid var(--gold)!important;outline-offset:3px;border-radius:12px;box-shadow:0 0 0 6px rgba(0,0,0,.3)!important;transition:outline .1s}
#tvHelp{position:fixed;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:6px 10px;border-radius:8px;z-index:9999;max-width:230px;line-height:1.4;opacity:.7}
#tvHelp b{color:var(--gold)}
@media(min-width:1600px){#tvHelp{font-size:13px;padding:8px 14px;max-width:300px}}
</style>
</head>
<body>
<div id="qrModal" onclick="this.style.display='none'" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;align-items:center;justify-content:center;cursor:pointer">
  <img id="qrModalImg" style="width:min(80vw,80vh);height:min(80vw,80vh);border-radius:20px" alt="QR grande">
</div>
<button id="themeToggle" onclick="toggleTheme()" title="Cambiar tema">🌙</button>

<div id="sLobby" class="screen active">
  <div class="grid2 gridLobby">
    <div>
      <div class="card" style="text-align:center;padding:24px 16px;animation:glowPulse 3s ease-in-out infinite">
        <div class="label">CÓDIGO DE SALA</div>
        <div class="code" id="codeDisp">------</div>
        <p style="color:var(--status-color);font-size:12px;margin-top:8px">Escanea para unirte</p>
        <div id="qrBox" style="margin-top:12px;display:flex;justify-content:center"></div>
        <p id="lobbyStatus" style="color:var(--status-color);font-size:11px;margin-top:10px;opacity:.7">iniciando emisión...</p>
      </div>
      <div class="card" style="margin-top:12px">
        <div class="label" style="margin-bottom:10px">EQUIPOS (<span id="teamCountL">0</span>)</div>
        <div id="teamDefList"></div>
        <div style="display:flex;gap:8px;margin-top:10px;align-items:stretch">
          <input id="newTeamName" type="text" placeholder="Nombre del equipo..."
            style="flex:1;min-width:0;background:var(--chip-bg);border:1px solid var(--wood);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;font-family:inherit"
            onkeydown="if(event.key==='Enter')addTeam()">
          <button class="btn btn-gold" style="flex-shrink:0;padding:10px 16px;font-size:14px;white-space:nowrap;box-shadow:none" onclick="addTeam()">+ Añadir</button>
        </div>
        <div id="teamListL" style="display:none"></div>
      </div>
      <button class="btn btn-gold" style="width:100%;margin-top:12px;font-size:18px;padding:16px" onclick="goGame()">▶ Empezar partida</button>
      <button class="btn btn-back" style="width:100%;margin-top:8px" onclick="newRoom()">↻ Nueva sala</button>
    </div>
    <div class="card">
      <div class="label">JUGADORES CONECTADOS (<span id="pCountL">0</span>)</div>
      <div id="pListL" style="margin-top:10px"></div>
    </div>
  </div>
</div>

<div id="sGame" class="screen">
  <div class="grid2 gridGame" style="align-items:stretch">
    <div style="display:flex;flex-direction:column;gap:12px;min-height:0">
      <div class="card" style="text-align:center;padding:12px;flex-shrink:0">
        <div style="display:flex;align-items:center;justify-content:center;gap:14px">
          <div>
            <div class="label">SALA</div>
            <div style="font-size:1.8rem;font-weight:900;color:var(--gold);letter-spacing:.1em" id="codeSmall"></div>
          </div>
          <div id="qrSmall"></div>
        </div>
        <div class="status" id="connStatus">●  conectado</div>
        <button class="btn btn-back" style="width:100%;margin-top:8px;font-size:11px;padding:7px" onclick="newRoom()">↻ Nueva sala</button>
      </div>
      <div class="card" style="flex:1;min-height:0;overflow-y:auto">
        <div class="label">JUGADORES (<span id="pCountG">0</span>)</div>
        <div id="pListG" style="margin-top:6px"></div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div id="mainPanel" class="card" style="min-height:380px;display:flex;flex-direction:column;justify-content:center"></div>
      <div id="rolesCard" class="card" style="display:none">
        <div class="label">ROLES (visibles en los móviles)</div>
        <div id="roleList" style="margin-top:8px"></div>
      </div>
    </div>
  </div>
</div>

 {n:"Torre de Naipes",d:"Construid una torre de cartas en 90 segundos. Mínimo 3 pisos. Por cada piso de menos retrocedéis 1 casilla; por cada piso de más avanzáis 1.",rt:"all",secs:90},
 {n:"Trabalenguas en Cadena",d:"Todos los miembros del equipo deben decir el mismo trabalenguas, uno por uno. Se permite 1 fallo; por cada fallo adicional, retrocedéis 1 casilla.",rt:"twister"},

evento:[
 {n:"Acústico Imperfecto",d:"El moderador pone 1 segundo de una canción. Pulsa el botón para bloquear: tendrás 10 segundos para responder. Si fallas, tu equipo no puede volver a pulsar hasta el siguiente rebote. El primero que acierte se lleva las casillas.",rt:"buzzer"},
 {n:"Carrera de la Cuchara",d:"Un representante por equipo sostiene una cuchara en la boca con una pelota de ping-pong encima. Carrera hasta la meta sin que caiga. 1º: +2 casillas · 2º: +1 · 3º: 0 · 4º: -1 y bajando.",rt:"rep_team",al:"CORREDOR",ad:"Cuchara en la boca, pelota encima. ¡Corre hasta la meta sin que caiga!",bl:"ESPECTADOR",bd:"Anima a tu corredor."},
 {n:"Eco Salvaje",d:"Patata caliente de palabras. La primera palabra que alguien diga en alto es la inicial. Por turnos (alternando equipos), cada uno dice una palabra que empiece por la última sílaba de la anterior. El equipo que no responda antes de que el contador llegue a 0 pierde y retrocede 5 casillas.",rt:"all",secs:90},
 {n:"Expedición Relámpago",d:"A cada equipo se le muestra una letra. Deben encontrar y traer un objeto que empiece por esa letra. Carrera: 1º +2 casillas, 2º +1, 3º 0, y bajando.",rt:"letter_hunt"},
 {n:"Pareja Indisoluble",d:"Una pareja de cada equipo se ata los tobillos (la pierna de uno con la del otro). Carrera hasta la meta. 1º +2 casillas, 2º +1, 3º 0, y bajando.",rt:"pair_race"},
 {n:"Los Gramos de la Risa",d:"Cada equipo en fila. Hay un bol lleno de harina en un extremo y un plato vacío (sobre una báscula) en el otro. Con una cuchara en la boca (¡sin manos!), id pasando la harina de uno a otro hasta el plato. El equipo con más GRAMOS al final gana. Cuidado con los estornudos...",rt:"all"},
 {n:"Relevo de la Esponja",d:"Cada equipo se pone en fila india. En un extremo hay un cubo lleno de agua y en el otro un cubo vacío. Con una esponja, el agua pasa de mano en mano por toda la fila hasta el cubo vacío. ¡El equipo que más agua trasvase (o que llene antes su cubo) gana!",rt:"all"},
 {n:"Caza de Color",d:"A un representante de cada equipo se le muestra un color en su móvil. El primero que fotografíe algo de ese color gana. 1º +2 casillas, 2º +1, y bajando.",rt:"color_hunt"},
 {n:"Limbo Universal",d:"Clásico limbo. Se baja la altura cada ronda. El que caiga, eliminado.",rt:"all"},
 {n:"Gran Prix de Cuclillas",d:"Todos en cuclillas a la señal. Se vale empujar (sin pasarse) para hacer caer a los demás. El último que aguante sin caer ni apoyarse gana para su equipo.",rt:"all"},
 {n:"Cuenta hasta 20",d:"Por turnos, juega primero un equipo y luego otro. El equipo cuenta en voz alta del 1 hacia arriba sin repetir número ni pisarse (si dos hablan a la vez, vuelta a empezar). El equipo que llegue más alto gana: 1º +2 casillas, 2º +1, y bajando.",rt:"all"},
 {n:"Balón Prisionero",d:"¡A matar! Equipos enfrentados se lanzan un balón blando. Si te da, quedas eliminado. El equipo que elimine a todos los rivales gana. Si hay varios equipos, el último con jugadores en pie gana.",rt:"all"},
 {n:"Duelo de Cartas",d:"Dos filas de jugadores con equipos intercalados (para que no se enfrenten compañeros). Una baraja en el centro. Los dos primeros sacan carta: la más alta gana, el otro queda eliminado. El ganador sigue contra el siguiente. Continúa hasta que solo queden jugadores de un mismo equipo: ese equipo gana.",rt:"all"},
 {n:"Ninja",d:"Todos en círculo con los brazos en pose ninja. Por turnos, haces UN solo movimiento para intentar golpear la mano de otro jugador; esa persona puede esquivar con UN solo movimiento. Si te tocan una mano, la escondes; si te tocan las dos, quedas eliminado. Último en pie gana para su equipo.",rt:"all"},
 {n:"¡La caja, LA CAJA!",d:"El banquero ofrece un trato seguro (avanzar X casillas fijas). Cada equipo decide en su móvil: ACEPTAR el trato, o arriesgarse y ABRIR LA CAJA misteriosa (puede dar mucho más... o mandarte hacia atrás). ¡Tú decides!",rt:"banker"},
 {n:"La Carta de la Suerte",d:"Hay una carta por equipo boca abajo. Una esconde una 👑 (avanza 3 casillas) y otra una 💀 (retrocede 5). El resto no tienen nada. Cada equipo elige una carta y se revela su destino. ¡Pura suerte!",rt:"cards"},
 {n:"Vota a la Minoría",d:"La TV plantea un \"esto o aquello\". Cada jugador vota en secreto en su móvil. ¡Gana quien vote la opción MENOS elegida! Cada acertante suma 1 punto para su equipo. Piensa bien: si todos creéis que algo es lo raro... dejará de serlo.",rt:"majority"},
],
versus:[
 {n:"Duelo Ancestral",d:"Piedra, papel o tijera. Mejor de 3 rondas.",rt:"rep",al:"COMBATIENTE",ad:"Tú juegas el duelo contra el representante rival.",bl:"HINCHA",bd:"Anima a tu representante."},
 {n:"Tres en Raya de la Muerte",d:"Un representante por equipo. El perdedor cumple penitencia.",rt:"rep",al:"JUGADOR",ad:"Tú juegas al Tres en Raya.",bl:"PÚBLICO",bd:"Decidid la penitencia si pierde vuestro representante."},
 {n:"Cara o Cruz Extremo",d:"El equipo retador lanza la moneda. El rival elige cara o cruz. El perdedor recibe penitencia.",rt:"rep",al:"LANZADOR",ad:"Tú lanzas la moneda.",bl:"ELECTOR",bd:"Elegid cara o cruz cuando lance el rival."},
 {n:"Cara de Piedra",d:"Un representante de cada equipo llena la boca de agua. Sus equipos intentan hacerles reír.",rt:"rep",al:"CARA DE PIEDRA",ad:"Llena la boca de agua. 60 segundos sin reírte.",bl:"COMEDIANTE",bd:"Haced reír al representante rival. Sin tocarlo."},
 {n:"Duelo de Fuerza",d:"Un representante por equipo. El que más flexiones seguidas haga sin parar, gana.",rt:"rep",al:"ATLETA",ad:"Tú haces las flexiones.",bl:"ÁRBITRO",bd:"Contad las flexiones."},
 {n:"Guardianes del Globo",d:"Dos representantes se pasan un globo sin que caiga, sujetándolo solo con la parte del cuerpo que indica la app (la misma para los dos). El que lo deje caer, pierde.",rt:"globe"},
 {n:"El Gran Salto",d:"Salto de longitud desde parado. Un intento por representante. El más lejos, gana.",rt:"rep",al:"SALTADOR",ad:"Tú saltas. Un intento.",bl:"JUEZ",bd:"Medid quién ha llegado más lejos."},
 {n:"Carrera de Natación",d:"Un representante de cada equipo nada un largo de la piscina. El más rápido gana.",rt:"rep",al:"NADADOR",ad:"Nada un largo lo más rápido que puedas. ¡El más rápido gana!",bl:"ÁNIMO",bd:"Anima a tu nadador desde el borde."},
 {n:"Trivia Rápida",d:"El moderador lee preguntas de cultura general. Pulsa el botón para responder: tienes 10 segundos. Si fallas, tu equipo no puede volver a pulsar hasta el siguiente rebote. El primero que acierte se lleva las casillas.",rt:"buzzer"},
 {n:"Tira y Afloja",d:"Con una cuerda o similar. Gana el equipo que cruce la línea central.",rt:"all"},
 {n:"Humming Battle",d:"Juega un equipo y luego el otro. Un cantante de cada equipo tararea una canción (de su móvil) y SU PROPIO equipo debe adivinarla. Cronómetro en marcha: cuando la adivinen, el cantante pulsa para parar el tiempo. El equipo más rápido gana. El tiempo se ve en la TV para evitar trampas.",rt:"humming"},
 {n:"Cazadores Rivales",d:"Se revela un objeto al azar. Ambos equipos corren a buscarlo por la casa. El primer equipo que lo traiga, gana.",rt:"hunt_versus"},
 {n:"Captura el Micro",d:"Dos filas enfrentadas, una por equipo. En el centro, un objeto que hará de micrófono. Suena 1 segundo de una canción: los dos jugadores de cabeza corren a por el micro y deben cantar la canción. El que no lo logre queda eliminado. Sigue hasta que un equipo se quede sin jugadores.",rt:"all"},
 {n:"Guerra de Canciones",d:"Se revela una palabra. Los dos equipos se turnan cantando trozos de canciones reales que la contengan. Cada equipo dispone de 90 segundos EN TOTAL, repartidos en los turnos que necesite. El primero que se quede sin tiempo o no sepa continuar, pierde.",rt:"songword_duel"},
 {n:"Canciones Temáticas",d:"Se revela una temática. Los dos equipos se turnan cantando trozos de canciones que encajen. Cada equipo dispone de 90 segundos EN TOTAL, repartidos en los turnos que necesite. El primero que se quede sin tiempo o no sepa seguir, pierde.",rt:"songtheme_duel"},
{n:"El Reloj Humano",d:"Un representante de cada equipo arranca su cronómetro y lo detiene lo más cerca posible de los 10 segundos, A CIEGAS: con la pantalla oculta, sin mirar el número que corre ni contar en voz alta. El más preciso gana.",rt:"timer_vs",al:"CRONÓMETRO",ad:"Arranca el cronómetro y párolo a los 10 segundos. ¡A CIEGAS! No mires el número mientras corre ni cuentes en alto."},
 {n:"Blindtest de Objetos",d:"Un representante con los ojos vendados debe identificar un objeto al tacto. ¡El EQUIPO RIVAL elige el objeto para complicarlo! 60 segundos. Si acierta, gana su equipo.",rt:"blindtest",al:"CIEGO",ad:"Te vendan los ojos. Toca el objeto que te dé el equipo rival e identifícalo.",bl:"ÁNIMO",bd:"El equipo rival elige el objeto. Anima a tu representante.",secs:60},
 {n:"Pulso de Miradas",d:"Un representante de cada equipo se miran fijamente a los ojos. El primero que ría, parpadee o aparte la mirada, pierde. El otro equipo gana.",rt:"rep",al:"MIRADA",ad:"Mira fijamente a tu rival. No rías ni parpadees. ¡Aguanta!",bl:"ÁNIMO",bd:"Anima a tu representante (sin distraerle demasiado)."},
 {n:"Reto de la Plancha",d:"Un representante de cada equipo hace la plancha abdominal a la vez. El último que aguante sin caer gana para su equipo. Cronómetro a la vista.",rt:"endurance",al:"ATLETA",ad:"Aguanta la plancha lo máximo posible. ¡El último en pie gana!",bl:"ÁNIMO",bd:"Anima a tu atleta."},
 {n:"Equilibrio Flamenco",d:"Un representante de cada equipo se sostiene a la pata coja, sin apoyarse en nada. El último en mantener el equilibrio gana. Cronómetro a la vista.",rt:"endurance",al:"FLAMENCO",ad:"A la pata coja, sin apoyarte. ¡Aguanta más que el rival!",bl:"ÁNIMO",bd:"Anima a tu representante."},
 {n:"Duelo de Memoria",d:"La TV muestra una secuencia de colores cada vez más larga. Por turnos, un representante de cada equipo debe repetirla. El primero que se equivoque pierde.",rt:"simon",al:"MEMORIA",ad:"Memoriza la secuencia de colores de la TV y repítela en orden.",bl:"ÁNIMO",bd:"Observa la secuencia en la TV."},
]};

const FB='https://okaloka-e0656-default-rtdb.europe-west1.firebasedatabase.app';
let fbSince=0,fbPollTimer=null;
function subscribe(){
  // Firebase polling transport. Reads messages newer than fbSince.
  if(fbPollTimer)clearInterval(fbPollTimer);
  fbSince=Date.now();
  const room=topic.replace('oca-','');
  const poll=async()=>{
    try{
      const r=await fetch(FB+'/rooms/'+room+'/msgs.json');
      if(!r.ok)return;
      const data=await r.json();
      const cs=document.getElementById('connStatus');if(cs)cs.textContent='● conectado';
      if(data){
        const cutoff=Date.now()-60000;
        const sorted=Object.keys(data).sort((a,b)=>data[a].t-data[b].t);
        sorted.forEach(k=>{
          const it=data[k];
          if(it.t>=fbSince){fbSince=it.t+1;onMsgData(it.d);}
          // clean up old messages so the DB doesn't grow forever
          if(it.t<cutoff){fetch(FB+'/rooms/'+room+'/msgs/'+k+'.json',{method:'DELETE'}).catch(()=>{});}
        });
      }
    }catch(e){const cs=document.getElementById('connStatus');if(cs)cs.textContent='● reconectando...';}
  };
  poll();
  fbPollTimer=setInterval(poll,1000);
}
function onMsgData(d){ // d is already the parsed message object
  try{ _processMsg(d); }catch(e){}
}
function tvDbg(msg){
  let el=document.getElementById('tvDbgLine');
  if(!el){
    el=document.createElement('div');el.id='tvDbgLine';
    el.style.cssText='position:fixed;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#0f0;font-size:13px;padding:6px 14px;border-radius:8px;z-index:9999;font-family:monospace';
    document.body.appendChild(el);
  }
  el.textContent=msg;
  clearTimeout(el._t);el._t=setTimeout(()=>{el.textContent='';},4000);
}
function _processMsg(d){
    if(d.type==='requestTeams'){pub({type:'teams',teams:teamDefs});return;}
    if(d.type==='cipherReveal'){pub({type:'cipherUpdate',revealed:d.revealed});return;}
    if(d.type==='buzzPress'){handleBuzz(d.name,d.team);return;}
    if(d.type==='buzzResult'){handleBuzzResult(d.success);return;}
    if(d.type==='buzzSync'){pub({type:'buzzState',state:buzzer});return;}
    if(d.type==='hummStart'){hummStart(d.team);return;}
    if(d.type==='hummStop'){hummStop(d.team,d.time);return;}
    if(d.type==='wildcard'){handleWildcard(d.name);return;}
    if(d.type==='steal'){handleSteal(d.name);return;}
    if(d.type==='vote'){majVotes[d.name]={opt:d.opt,team:d.team};renderMajority();return;}
    if(d.type==='bankDecision'){bankDecisions[d.team]=d.choice;renderBanker();return;}
    if(d.type==='join'){
      players[d.name]={name:d.name,team:d.team};saveTV();renderPlayers();
      // Only re-send teams + refresh wizard when we're idle (lobby or wizard category choice),
      // never while a challenge/timer/buzzer is on screen.
      const idle=!lastCh && wState==='cat';
      if(idle){pub({type:'teams',teams:teamDefs});if(document.getElementById('sGame').classList.contains('active'))renderWizard();}
    }
  }
function onMsg(e){try{const d=JSON.parse(JSON.parse(e.data).message);_processMsg(d);}catch(err){}}
async function pub(data){try{const room=topic.replace('oca-','');await fetch(FB+'/rooms/'+room+'/msgs.json',{method:'POST',body:JSON.stringify({t:Date.now(),d:data})});}catch(e){}}

    const tp=ps.filter(function(p){return p.team===t.id;});
    if(!tp.length)return;

// ════ Launch challenge ════
function pickChallenge(type){
  const pool=CH[type];
  const recent=recentCh[type]||[];
  // how many recent picks to avoid: up to ~40% of pool (at least 1, at most pool-1)
  const avoidCount=Math.min(Math.max(1,Math.floor(pool.length*0.4)),pool.length-1);
  const banned=new Set(recent.slice(-avoidCount).map(x=>x.n));
  // candidates not recently used
  let candidates=pool.filter(ch=>!banned.has(ch.n));
  if(!candidates.length)candidates=pool;
  const ch=candidates[Math.floor(Math.random()*candidates.length)];
  // record it
  recent.push(ch);
  if(recent.length>pool.length)recent.shift();
  recentCh[type]=recent;
  return ch;
}
function launch(){
  if(busy)return;busy=true;
  const pool=CH[wType];
  const ch=pickChallenge(wType);
  const ps=Object.values(players);
  let active;
  if(wType==='minijuego'||wType==='musical')active=ps.filter(p=>p.team===wActive);
  else if(wType==='evento')active=ps;
  else active=ps.filter(p=>p.team===wActive||p.team===wOpp);
  const {roles,roulette,publicHint}=assignRoles(ch,active,ps,wActive,wOpp);
  if(ch.secs){for(const n in roles){roles[n].waitStart=true;}}
  pub({type:'challenge',name:ch.n,desc:ch.d,ctype:wType,roles,roulette});
  lastCh={ch,type:wType,roles,aT:wActive,oT:wOpp,publicHint};saveTV();
  if(ch.secs){chTimerTotal=ch.secs;chTimerSecs=ch.secs;chTimerRunning=false;if(chTimer){clearInterval(chTimer);chTimer=null;}}
  if(ch.rt==='hotpotato'){hpRemaining=90;hpRunning=false;if(hpTimer){clearInterval(hpTimer);hpTimer=null;}}
  if(ch.rt==='humming'){humming={times:{},running:{},starts:{}};}
  const afterReveal=()=>{
    renderRoles(roles,ps);busy=false;
    // Prepare data for special panels, but show the PRESENTATION first with a button to open the panel.
    if(ch.rt==='quiz'){pickQuizQuestion();}
    if(ch.rt==='majority'){pickMajorityQuestion();}
    if(ch.rt==='cards'){setupCards();}
    if(ch.rt==='banker'){setupBanker();}
    if(ch.rt==='songword_duel'||ch.rt==='songtheme_duel'){setupSongDuel();}
    if(ch.rt==='buzzer'){resetBuzzer();}
    addSpecialPanelButton();
  };
  if(roulette){
    playTVRoulette(roulette,()=>{finalChallenge(ch,wType,publicHint);afterReveal();});
  }else{
    slotReveal(ch,wType,afterReveal,publicHint);
  }
}

function slotReveal(ch,type,done,publicHint){
  const bg={minijuego:'var(--cat-mini)',evento:'var(--cat-evento)',versus:'var(--cat-versus)',musical:'var(--cat-musical)'}[type];
  const em={minijuego:'🎮',evento:'⚡',versus:'⚔️',musical:'🎵'}[type];
  const lb={minijuego:'MINIJUEGO',evento:'EVENTO',versus:'VERSUS',musical:'MUSICAL'}[type];
  const names=CH[type].map(c=>c.n);
  const seq=[];
  for(let i=0;i<14;i++)seq.push(names[Math.floor(Math.random()*names.length)]);
  seq.push(ch.n);
  document.getElementById('mainPanel').innerHTML=`<div style="background:${bg};border-radius:16px;padding:40px;text-align:center">
    <div style="font-size:64px">${em}</div>
    <div style="color:rgba(255,255,255,.5);font-size:13px;font-weight:800;letter-spacing:.12em;margin:8px 0">${lb}</div>

  let i=0,delay=70;

    document.getElementById('slotTxt').textContent=seq[i];
    i++;
    if(i<seq.length){delay*=1.18;setTimeout(step,delay);}

  })();
}

function playTVRoulette(r,done){
  document.getElementById('rolesCard').style.display='none';
  // Normalize: single roulette -> wrap as one group
  const groups=r.multi?r.groups:[{order:r.order,steps:r.steps,winnerIdx:r.winnerIdx,label:''}];
  if(!groups.length){done();return;}
  let html='<div style="text-align:center"><div style="font-size:48px;margin-bottom:8px">🎰</div>'+
    '<div style="color:var(--gold);font-size:15px;font-weight:900;letter-spacing:.14em;margin-bottom:24px">SORTEANDO...</div>'+
    '<div style="display:flex;gap:24px;justify-content:center;flex-wrap:wrap;align-items:flex-start">';
  groups.forEach((g,gi)=>{
    html+='<div style="display:flex;flex-direction:column;align-items:center;gap:10px">';
    if(g.label)html+='<div style="font-size:13px;font-weight:800;color:var(--dim);letter-spacing:.06em">'+g.label+'</div>';
    html+='<div style="display:flex;flex-direction:column;gap:8px">'+
      g.order.map((n,i)=>'<div class="roul-name" id="rn'+gi+'_'+i+'">'+n+'</div>').join('')+
      '</div></div>';
  });
  html+='</div></div>';
  document.getElementById('mainPanel').innerHTML=html;
  let finished=0;
  groups.forEach((g,gi)=>{
    let step=0;
    (function tick(){
      g.order.forEach((n,i)=>{const el=document.getElementById('rn'+gi+'_'+i);if(el)el.classList.remove('lit');});
      const cur=document.getElementById('rn'+gi+'_'+(step%g.order.length));
      if(cur)cur.classList.add('lit');
      step++;
      if(step<g.steps.length){setTimeout(tick,g.steps[step]);}
      else{
        g.order.forEach((n,i)=>{const el=document.getElementById('rn'+gi+'_'+i);if(el)el.classList.remove('lit');});
        const win=document.getElementById('rn'+gi+'_'+g.winnerIdx);
        if(win)win.classList.add('winner');
        confetti();
        finished++;
        if(finished===groups.length)setTimeout(done,2200);
      }
    })();
  });
}

}

function confetti(){
  const colors=['var(--gold)','#e74c3c','#3498db','#2ecc71','#f39c12','#e91e8c'];
  for(let i=0;i<60;i++){
    const c=document.createElement('div');

    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration=(2+Math.random()*2)+'s';
    c.style.animationDelay=Math.random()*0.8+'s';

function buildMultiRoulette(groups){
  // groups: [{cands:[names], winner:name, label:teamName}]
  const built=groups.filter(g=>g.cands&&g.cands.length>1).map(g=>{
    const r=buildRoulette(g.cands,g.winner);
    r.label=g.label||'';
    return r;
  });
  return built.length?{multi:true,groups:built}:null;
}
function buildRoulette(candidates,winnerName){
  const order=[...candidates].sort(()=>Math.random()-.5);
  const winnerIdx=order.indexOf(winnerName);
  const loops=2+Math.floor(Math.random()*2);
  const totalSteps=loops*order.length+winnerIdx+1;
  const steps=[];
  let d=90;
  for(let i=0;i<totalSteps;i++){
    steps.push(Math.round(d));
    const remaining=totalSteps-i;
    if(remaining<8)d*=1.35;else d*=1.02;
  }
  return{order,steps,winnerIdx};
}

      active.forEach(p=>{R[p.name]={label:'PARTICIPAS',emoji:'👥',isSecret:false,roleDesc:ch.d};});
      break;
    case'actor':{
      const tp=active.filter(p=>p.team===aT);
      const actor=rnd(tp);
      if(tp.length>1)roulette=buildRoulette(tp.map(p=>p.name),actor.name);
      tp.forEach(p=>{R[p.name]=p.name===actor.name
        ?{label:ch.al,emoji:'⭐',isSecret:false,roleDesc:ch.ad,chosen:true}
        :{label:ch.bl,emoji:'👥',isSecret:false,roleDesc:ch.bd};});
      active.filter(p=>p.team!==aT).forEach(p=>{R[p.name]={label:'ESPECTADOR',emoji:'👁️',isSecret:false,roleDesc:'Observa.'};});
      break;}
    case'chain':{
      const tp=shuf(active.filter(p=>p.team===aT));
      tp.forEach((p,i)=>{const f=i===0,l=i===tp.length-1;
        R[p.name]={label:f?'PRIMERO':l?'ÚLTIMO':'#'+(i+1),emoji:f?'1️⃣':l?'🔚':(i+1)+'️⃣',isSecret:false,
          roleDesc:f?'Tú empiezas la cadena.':l?'Tú cierras la cadena.':'Eres el número '+(i+1)+' en la cadena.'};});
      active.filter(p=>p.team!==aT).forEach(p=>{R[p.name]={label:'ESPECTADOR',emoji:'👁️',isSecret:false,roleDesc:'Observa.'};});
      break;}
    case'artist_back':{
      const tp=shuf(active.filter(p=>p.team===aT));
      if(tp.length>=2){
        const word=rndOf(WORDS);
        R[tp[0].name]={label:'ARTISTA',emoji:'✍️',isSecret:false,roleDesc:'Dibuja ESTE OBJETO (no la palabra) con el dedo en la espalda de '+tp[1].name+'. Que solo lo veas tú.',phrase:word};
        R[tp[1].name]={label:'RECEPTOR',emoji:'🔮',isSecret:false,roleDesc:'Te dibujan en la espalda. Solo TÚ debes adivinar qué es, sin mirar.',chosen:true};
        tp.slice(2).forEach(p=>{R[p.name]={label:'ESPECTADOR',emoji:'👁️',isSecret:false,roleDesc:'Observa en silencio. No ayudes a adivinar.'};});
      }else tp.forEach(p=>{R[p.name]={label:'PARTICIPA',emoji:'👥',isSecret:false,roleDesc:ch.d};});
      active.filter(p=>p.team!==aT).forEach(p=>{R[p.name]={label:'ESPECTADOR',emoji:'👁️',isSecret:false,roleDesc:'Observa.'};});
      break;}
    case'mirror':{
      const tp=shuf(active.filter(p=>p.team===aT));
      if(tp.length>=2){
        R[tp[0].name]={label:'LÍDER',emoji:'🎭',isSecret:false,roleDesc:'Haz movimientos lentos. '+tp[1].name+' te copiará.'};
        R[tp[1].name]={label:'ESPEJO',emoji:'🪞',isSecret:false,roleDesc:'Copia cada movimiento de '+tp[0].name+'.'};
        tp.slice(2).forEach(p=>{R[p.name]={label:'JURADO',emoji:'⭐',isSecret:false,roleDesc:'Evaluad la sincronía.'};});
      }else tp.forEach(p=>{R[p.name]={label:'PARTICIPA',emoji:'👥',isSecret:false,roleDesc:ch.d};});
      active.filter(p=>p.team!==aT).forEach(p=>{R[p.name]={label:'JURADO',emoji:'⭐',isSecret:false,roleDesc:'Evaluad.'};});
      break;}
    case'pair':{
      const tp=shuf(active.filter(p=>p.team===aT));
      if(tp.length>=2){
        R[tp[0].name]={label:'PAREJA A',emoji:'🤝',isSecret:false,roleDesc:'Formas pareja con '+tp[1].name+'.',chosen:true,pairWith:tp[1].name};
        R[tp[1].name]={label:'PAREJA B',emoji:'🤝',isSecret:false,roleDesc:'Formas pareja con '+tp[0].name+'.',chosen:true,pairWith:tp[0].name};
        tp.slice(2).forEach(p=>{R[p.name]={label:'APOYO',emoji:'👥',isSecret:false,roleDesc:'Animad a la pareja.'};});
      }else tp.forEach(p=>{R[p.name]={label:'PARTICIPA',emoji:'👥',isSecret:false,roleDesc:ch.d};});
      active.filter(p=>p.team!==aT).forEach(p=>{R[p.name]={label:'ESPECTADOR',emoji:'👁️',isSecret:false,roleDesc:'Observa.'};});
      break;}
    case'rep':{
      const groups=[];
      [aT,oT].filter(Boolean).forEach(t=>{
        const tp=active.filter(p=>p.team===t);if(!tp.length)return;
        const rep=rnd(tp);
        const tn=(teamDefs.find(x=>x.id===t)||{}).name||('Equipo '+t);
        groups.push({cands:tp.map(p=>p.name),winner:rep.name,label:tn});
        tp.forEach(p=>{R[p.name]=p.name===rep.name
          ?{label:ch.al||'REPRESENTANTE',emoji:'⭐',isSecret:false,roleDesc:ch.ad||'Tú compites por tu equipo.',chosen:true}
          :{label:ch.bl||'EQUIPO',emoji:'👥',isSecret:false,roleDesc:ch.bd||'Anima a tu representante.'};});
      });
      roulette=buildMultiRoulette(groups);
      break;}
    case'rep_team':{
      const groups=[];
      teams.forEach(t=>{
        const tp=active.filter(p=>p.team===t);if(!tp.length)return;
        const rep=rnd(tp);
        const tn=(teamDefs.find(x=>x.id===t)||{}).name||('Equipo '+t);
        groups.push({cands:tp.map(p=>p.name),winner:rep.name,label:tn});
        tp.forEach(p=>{R[p.name]=p.name===rep.name
          ?{label:ch.al||'REPRESENTANTE',emoji:'⭐',isSecret:false,roleDesc:ch.ad||'Tú participas por tu equipo.',chosen:true}
          :{label:ch.bl||'EQUIPO',emoji:'👥',isSecret:false,roleDesc:ch.bd||'Anima a tu representante.'};});
      });
      roulette=buildMultiRoulette(groups);
      break;}
    case'pair_team':{
      teams.forEach(t=>{
        const tp=shuf(active.filter(p=>p.team===t));if(!tp.length)return;
        if(tp.length>=2){
          R[tp[0].name]={label:'ATADO A',emoji:'🔗',isSecret:false,roleDesc:'Os atáis el tobillo con '+tp[1].name+'.'};
          R[tp[1].name]={label:'ATADO B',emoji:'🔗',isSecret:false,roleDesc:'Os atáis el tobillo con '+tp[0].name+'.'};
          tp.slice(2).forEach(p=>{R[p.name]={label:'LIBRE',emoji:'👟',isSecret:false,roleDesc:'La pareja de vuestro equipo os representa.'};});
        }else tp.forEach(p=>{R[p.name]={label:'PARTICIPA',emoji:'👥',isSecret:false,roleDesc:ch.d};});
      });
      break;}
    case'sides':{
      if(teams.length>=2){
        active.filter(p=>p.team===teams[0]).forEach(p=>{R[p.name]={label:'DEFIENDE EL SÍ',emoji:'✅',isSecret:false,roleDesc:'Vuestro equipo defiende el SÍ. Argumentad con convicción.'};});
        active.filter(p=>p.team===teams[1]).forEach(p=>{R[p.name]={label:'DEFIENDE EL NO',emoji:'❌',isSecret:false,roleDesc:'Vuestro equipo defiende el NO. Argumentad con convicción.'};});
        teams.slice(2).forEach(t=>{active.filter(p=>p.team===t).forEach(p=>{R[p.name]={label:'JURADO',emoji:'⚖️',isSecret:false,roleDesc:'Votáis al equipo más convincente.'};});});
      }else active.forEach(p=>{R[p.name]={label:'PARTICIPA',emoji:'👥',isSecret:false,roleDesc:ch.d};});
      break;}
    default:
      active.forEach(p=>{R[p.name]={label:'PARTICIPA',emoji:'👥',isSecret:false,roleDesc:ch.d};});
  }
  return{roles:R,roulette,publicHint};
}

function handleBuzz(name,team){
  if(!lastCh||lastCh.ch.rt!=='buzzer')return;
  // Only accept if nobody currently locked and this team isn't vetoed
  if(buzzer.locked)return;
  if(buzzer.vetoed.includes(team))return;
  buzzer.locked=name;buzzer.lockedTeam=team;
  buzzer.deadline=Date.now()+10000;
  pub({type:'buzzState',state:buzzer});
  renderBuzzerTV();
  if(buzzerTimer)clearInterval(buzzerTimer);
  buzzerTimer=setInterval(()=>{
    renderBuzzerTV();
    if(Date.now()>=buzzer.deadline){
      handleBuzzResult(false);
    }
  },250);
}
function handleBuzzResult(success){
  if(buzzerTimer){clearInterval(buzzerTimer);buzzerTimer=null;}
  if(!lastCh||lastCh.ch.rt!=='buzzer')return;
  if(success){
    pub({type:'buzzWin',team:buzzer.lockedTeam,name:buzzer.locked});
    confetti();
    buzzer={locked:null,lockedTeam:null,vetoed:[],deadline:0};
    renderBuzzerTV();
  }else{
    // Veto the team that just failed until next rebound; rebound (unlock)
    const failedTeam=buzzer.lockedTeam;
    const vetoed=[...buzzer.vetoed];
    if(failedTeam&&!vetoed.includes(failedTeam))vetoed.push(failedTeam);
    // If all participating teams vetoed, clear vetoes (everyone can try again)
    const allTeams=[...new Set(Object.values(players).map(p=>p.team))];
    const stillFree=allTeams.filter(t=>!vetoed.includes(t));
    buzzer={locked:null,lockedTeam:null,vetoed:stillFree.length?vetoed:[],deadline:0};
    pub({type:'buzzState',state:buzzer});
    renderBuzzerTV();
  }
}

function getChosenNames(){
  const out=[];
  if(!lastCh||!lastCh.roles)return out;
  for(const n in lastCh.roles){if(lastCh.roles[n].chosen)out.push(n);}
  return out;
}
function candsForTeam(team){
  return Object.values(players).filter(p=>p.team===team).map(p=>p.name);
}
function swapRole(oldName,newName){
  // give oldName's chosen role to newName, oldName becomes a normal participant
  const chosenRole=lastCh.roles[oldName];
  const otherRole=lastCh.roles[newName];
  // update pair references if present
  const updated=Object.assign({},chosenRole);
  lastCh.roles[newName]=updated;
  lastCh.roles[oldName]=(otherRole&&!otherRole.chosen)?otherRole:{label:'EQUIPO',emoji:'👥',isSecret:false,roleDesc:'Ahora participas con el resto del equipo.'};
  // fix pairWith pointers on partner if any
  for(const n in lastCh.roles){
    if(lastCh.roles[n].pairWith===oldName)lastCh.roles[n].pairWith=newName;
  }
  if(updated.pairWith){updated.roleDesc='Formas pareja con '+updated.pairWith+'.';}
  pub({type:'challenge',name:lastCh.ch.n,desc:lastCh.ch.d,ctype:lastCh.type,roles:lastCh.roles,roulette:null});
  saveTV();
  renderRoles(lastCh.roles,Object.values(players));
}
function handleWildcard(name){
  const chosen=getChosenNames();
  if(!chosen.includes(name))return; // only a chosen player can wildcard
  const team=(players[name]||{}).team;
  // pool = same team, not currently chosen
  const pool=candsForTeam(team).filter(n=>!chosen.includes(n));
  if(!pool.length)return;
  const pick=pool[Math.floor(Math.random()*pool.length)];
  showStealAnim('🃏','COMODÍN','Nuevo elegido',pick);
  swapRole(name,pick);
}
function handleSteal(name){
  const chosen=getChosenNames();
  if(chosen.includes(name))return; // already chosen
  const team=(players[name]||{}).team;
  // find a chosen player on the same team to steal from
  const target=chosen.find(n=>(players[n]||{}).team===team);
  if(!target)return;
  showStealAnim('🦹','¡ROBO!',name+' roba la posición a',target);
  swapRole(target,name);
}

  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:450;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;cursor:pointer;animation:fadeIn .2s';
  ov.innerHTML='<div style="font-size:96px;animation:chPop .5s cubic-bezier(.2,1.4,.4,1)">'+emoji+'</div><div style="font-size:40px;font-weight:900;color:var(--gold);margin-top:6px">'+title+'</div><div style="font-size:18px;color:rgba(255,255,255,.7);margin-top:14px">'+subtitle+'</div><div style="font-size:32px;font-weight:900;margin-top:6px">'+who+'</div>';
  ov.onclick=()=>ov.remove();
  document.body.appendChild(ov);
  setTimeout(()=>{if(ov.parentNode)ov.remove();},3500);
  confetti();
}

  if(!mp||document.getElementById('nextRoundBtn'))return;

}
function addBackToChallengeBtn(){

function specialPanelInfo(){
  if(!lastCh)return null;
  const rt=lastCh.ch.rt;
  if(rt==='buzzer')return {label:'▶ Ir al pulsador',fn:'openSpecialPanel'};
  if(rt==='hotpotato')return {label:'▶ Ir al contador',fn:'openSpecialPanel'};
  if(rt==='humming')return {label:'▶ Ir a los cronómetros',fn:'openSpecialPanel'};
  if(rt==='endurance')return {label:'▶ Ir al cronómetro',fn:'openSpecialPanel'};
  if(rt==='simon')return {label:'▶ Ir a la secuencia',fn:'openSpecialPanel'};
  if(rt==='quiz')return {label:'▶ Ver la pregunta',fn:'openSpecialPanel'};
  if(rt==='majority')return {label:'▶ Ir a la votación',fn:'openSpecialPanel'};
  if(rt==='cards')return {label:'▶ Ir a las cartas',fn:'openSpecialPanel'};
  if(rt==='banker')return {label:'▶ Ir a la oferta',fn:'openSpecialPanel'};
  if(rt==='songword_duel'||rt==='songtheme_duel')return {label:'▶ Ir a los cronómetros',fn:'openSpecialPanel'};
  return null;
}
function addSpecialPanelButton(){
  const info=specialPanelInfo();
  if(!info)return;
  const mp=document.getElementById('mainPanel');
  if(!mp)return;
  // avoid duplicate
  if(document.getElementById('specialPanelBtn'))return;
  const btn=document.createElement('button');
  btn.id='specialPanelBtn';
  btn.className='btn btn-gold';
  btn.style.cssText='margin-top:14px;width:100%;font-size:16px';
  btn.textContent=info.label;
  btn.onclick=()=>window[info.fn]();
  // insert before the "siguiente casilla" button if present, else append
  mp.appendChild(btn);
}
function openSpecialPanel(){
  if(!lastCh)return;
  lastCh.panelView='special';saveTV();
  const rt=lastCh.ch.rt;
  if(rt==='buzzer'){renderBuzzerTV();}
  else if(rt==='hotpotato'){renderHotPotato();}
  else if(rt==='humming'){renderHumming();}
  else if(rt==='endurance'){endur={running:false,start:0,raf:null,fell:{},_final:0};renderEndurance();}
  else if(rt==='simon'){simon={seq:[],pos:0,showing:false};renderSimon();}
  else if(rt==='quiz'){if(!quizQ)pickQuizQuestion();renderQuiz();}
  else if(rt==='majority'){if(!majQ)pickMajorityQuestion();renderMajority();}
  else if(rt==='cards'){if(!cardDeck.length)setupCards();renderCards();}
  else if(rt==='banker'){renderBanker();}
  else if(rt==='songword_duel'||rt==='songtheme_duel'){if(!Object.keys(songDuel.remaining).length)setupSongDuel();renderSongDuel();}
}
function renderEndurance(){
  const mp=document.getElementById('mainPanel');
  if(!mp||!lastCh||lastCh.ch.rt!=='endurance')return;
  const teamsIn=[lastCh.aT,lastCh.oT].filter(Boolean);
  const tn=t=>{const d=teamDefs.find(x=>x.id===t);return d?d.name:'Equipo '+t;};
  let html='<div style="text-align:center"><div style="font-size:52px">💪</div>';
  html+='<div style="color:var(--cat-versus);font-size:15px;font-weight:900;letter-spacing:.12em;margin:6px 0">'+lastCh.ch.n.toUpperCase()+'</div>';
  const secs=endur.running?((Date.now()-endur.start)/1000):(endur._final||0);
  html+='<div style="font-size:72px;font-weight:900;color:var(--gold);line-height:1;margin:10px 0">'+secs.toFixed(1)+'s</div>';
  if(!endur.running&&!endur._final){
    html+='<button class="btn btn-gold" style="padding:14px 32px;font-size:17px" onclick="endurStart()">▶ Empezar</button>';
  }else{
    html+='<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px">';
    teamsIn.forEach(t=>{
      if(endur.fell[t]){
        html+='<div style="background:var(--card);border:2px solid var(--wood);border-radius:12px;padding:10px 16px;opacity:.6"><div style="font-size:12px;color:var(--dim)">'+tn(t)+'</div><div style="font-weight:900;color:var(--dim)">cayó a los '+endur.fell[t].toFixed(1)+'s</div></div>';
      }else{
        html+='<button class="btn" style="background:var(--kick-bg);color:var(--kick-color);padding:12px 18px;font-size:14px" onclick="endurFell(\''+t+'\')">'+tn(t)+' cayó</button>';
      }
    });
    html+='</div>';
  }
  // Winner detection: only one team not fallen
  const standing=teamsIn.filter(t=>!endur.fell[t]);
  if(endur._final&&standing.length===1){
    html+='<div style="font-size:24px;font-weight:900;color:#22c55e;margin-top:16px">🏆 Gana '+tn(standing[0])+'</div>';
  }
  html+='</div>';
  mp.innerHTML=html;
  addBackToChallengeBtn();
  addNextRoundBtn();
}
function endurStart(){
  endur={running:true,start:Date.now(),raf:null,fell:{},_final:0};
  const tick=()=>{if(!endur.running)return;renderEndurance();endur.raf=requestAnimationFrame(tick);};
  tick();
}
function endurFell(t){
  const secs=(Date.now()-endur.start)/1000;
  endur.fell[t]=secs;
  const teamsIn=[lastCh.aT,lastCh.oT].filter(Boolean);
  const standing=teamsIn.filter(x=>!endur.fell[x]);
  if(standing.length<=1){
    endur.running=false;endur._final=secs;
    if(endur.raf)cancelAnimationFrame(endur.raf);
    confetti();
  }
  renderEndurance();
}
function renderSimon(){
  const mp=document.getElementById('mainPanel');
  if(!mp||!lastCh||lastCh.ch.rt!=='simon')return;
  const COLORS=[{n:'ROJO',c:'#e21b3c'},{n:'AZUL',c:'#1cb0f6'},{n:'VERDE',c:'#22c55e'},{n:'AMARILLO',c:'#f5b800'}];
  let html='<div style="text-align:center"><div style="font-size:48px">🧠</div>';
  html+='<div style="color:var(--cat-versus);font-size:15px;font-weight:900;letter-spacing:.12em;margin:6px 0">DUELO DE MEMORIA</div>';
  html+='<div style="color:var(--dim);font-size:13px;margin-bottom:10px">Secuencia actual: '+simon.seq.length+' colores. Por turnos, cada representante la repite. El que falle, pierde.</div>';
  html+='<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:260px;margin:0 auto">';
  COLORS.forEach((col,i)=>{
    const lit=simon.showing&&simon.seq[simon.pos]===i;
    html+='<div id="simC'+i+'" style="aspect-ratio:1.6;border-radius:14px;background:'+col.c+';opacity:'+(lit?'1':'.35')+';transition:opacity .15s;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:13px">'+col.n+'</div>';
  });
  html+='</div>';
  html+='<button class="btn btn-gold" style="margin-top:16px;padding:12px 24px;font-size:15px" onclick="simonNext()">'+(simon.seq.length?'▶ Añadir color y mostrar':'▶ Empezar secuencia')+'</button>';
  html+='</div>';
  mp.innerHTML=html;
  addBackToChallengeBtn();
  addNextRoundBtn();
}
function simonNext(){
  simon.seq.push(Math.floor(Math.random()*4));
  playSimonSequence();
}
function playSimonSequence(){
  simon.showing=true;simon.pos=0;renderSimon();
  let i=0;
  const step=()=>{
    if(i>=simon.seq.length){simon.showing=false;renderSimon();return;}
    simon.pos=i;renderSimon();
    setTimeout(()=>{simon.showing=false;renderSimon();setTimeout(()=>{i++;simon.showing=true;step();},250);},600);
  };
  step();
}
const QUIZ_POOLS={Q_YEAR,Q_MORE,Q_REFRAN,Q_EMOJI,Q_TF,Q_ORDER,Q_SONG_YEAR,Q_MOVIE_YEAR};

function quizNext(){pickQuizQuestion();renderQuiz();}
function pickMajorityQuestion(){
  const i=Math.floor(Math.random()*VOTE_Q.length);
  majQ={q:VOTE_Q[i],opts:VOTE_OPTS[i]};
  majVotes={};majRevealed=false;
  if(lastCh){lastCh.majQ=majQ;saveTV();}
  // broadcast the question so phones show the right options
  pub({type:'voteQ',q:majQ.q,opts:majQ.opts});
}
function renderMajority(){
  const mp=document.getElementById('mainPanel');
  if(!mp||!lastCh||lastCh.ch.rt!=='majority'||!majQ)return;
  const counts=[0,0];
  Object.values(majVotes).forEach(v=>{if(v.opt===0)counts[0]++;else if(v.opt===1)counts[1]++;});
  const total=counts[0]+counts[1];
  // Minority = the option with FEWER votes (ties => nobody wins)
  const minIdx=counts[0]===counts[1]?-1:(counts[0]<counts[1]?0:1);
  let html='<div style="text-align:center"><div style="font-size:44px">🗳️</div>';
  html+='<div style="color:var(--cat-evento);font-size:14px;font-weight:900;letter-spacing:.12em;margin:6px 0">VOTA A LA MINORÍA</div>';
  html+='<div style="font-size:26px;font-weight:900;color:#fff;margin:14px 0">'+majQ.q+'</div>';
  html+='<div style="display:flex;gap:12px;justify-content:center;margin-top:10px">';
  majQ.opts.forEach((o,i)=>{
    const pct=total?Math.round(counts[i]/total*100):0;
    const win=majRevealed&&minIdx===i;
    html+='<div style="flex:1;max-width:200px;background:var(--card);border:2px solid '+(win?'#22c55e':'var(--wood)')+';border-radius:14px;padding:16px">';
    html+='<div style="font-size:18px;font-weight:900;color:'+(win?'#22c55e':'#fff')+'">'+o+(win?' 🏆':'')+'</div>';
    if(majRevealed){html+='<div style="font-size:32px;font-weight:900;color:var(--gold);margin-top:6px">'+counts[i]+'</div><div style="font-size:12px;color:var(--dim)">'+pct+'%</div>';}
    html+='</div>';
  });
  html+='</div>';
  html+='<div style="color:var(--dim);font-size:13px;margin-top:10px">'+total+' votos recibidos</div>';
  if(!majRevealed){
    html+='<button class="btn btn-gold" style="margin-top:12px;width:100%;font-size:16px" onclick="majReveal()">👁️ Revelar minoría</button>';
  }else{
    if(minIdx<0){
      html+='<div style="font-size:20px;font-weight:900;color:var(--gold);margin-top:12px">¡EMPATE! Nadie suma punto</div>';
    }else{
      // award points: each winner (voted the minority) gives +1 to their team
      const teamPts={};
      Object.values(majVotes).forEach(v=>{if(v.opt===minIdx&&v.team){teamPts[v.team]=(teamPts[v.team]||0)+1;}});
      html+='<div style="font-size:17px;font-weight:900;color:#22c55e;margin-top:12px">Minoría: \"'+majQ.opts[minIdx]+'\" · +1 punto por acertante</div>';
      const tn=t=>{const d=teamDefs.find(x=>x.id===t);return d?d.name:'Equipo '+t;};
      const ranked=Object.keys(teamPts).sort((a,b)=>teamPts[b]-teamPts[a]);
      if(ranked.length){
        html+='<div style="margin-top:12px;display:flex;flex-direction:column;gap:6px;max-width:320px;margin-left:auto;margin-right:auto">';
        ranked.forEach((t,i)=>{
          html+='<div style="display:flex;justify-content:space-between;background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid '+(i===0?'#22c55e':'var(--wood)')+'"><span style="font-weight:700">'+(i===0?'🏆 ':'')+tn(t)+'</span><span style="font-weight:900;color:var(--gold)">'+teamPts[t]+' pts</span></div>';
        });
        html+='</div>';
      }else{
        html+='<div style="color:var(--dim);font-size:13px;margin-top:8px">Ningún equipo acertó la minoría</div>';
      }
    }
  }
  html+='<button class="btn btn-gold" style="margin-top:10px;width:100%;font-size:15px" onclick="majNext()">🔀 Otra pregunta</button>';
  html+='</div>';
  mp.innerHTML=html;
  addBackToChallengeBtn();
  addNextRoundBtn();
}
function majReveal(){majRevealed=true;pub({type:'voteReveal'});renderMajority();}
function majNext(){pickMajorityQuestion();renderMajority();}
function setupCards(){
  const teamsIn=teams();
  const n=Math.max(teamsIn.length,2);
  // build deck: 1 crown, 1 skull, rest blank
  const deck=[];
  deck.push({type:'crown'});
  deck.push({type:'skull'});
  for(let i=2;i<n;i++)deck.push({type:'blank'});
  // shuffle
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  cardDeck=deck.map((card,i)=>({...card,id:i,revealed:false,takenBy:null}));
  cardPicks={};
}
function renderCards(){
  const mp=document.getElementById('mainPanel');
  if(!mp||!lastCh||lastCh.ch.rt!=='cards')return;
  if(!cardDeck.length)setupCards();
  const teamsIn=teams();
  const tn=t=>{const d=teamDefs.find(x=>x.id===t);return d?d.name:'Equipo '+t;};
  const pending=teamsIn.filter(t=>!Object.values(cardPicks).includes(t));
  const nextTeam=pending[0]||null;
  let html='<div style="text-align:center"><div style="font-size:44px">🃏</div>';
  html+='<div style="color:var(--cat-evento);font-size:14px;font-weight:900;letter-spacing:.12em;margin:6px 0">LA CARTA DE LA SUERTE</div>';
  if(nextTeam){
    html+='<div style="font-size:20px;font-weight:900;color:#fff;margin:10px 0">Elige carta: <span style="color:var(--gold)">'+tn(nextTeam)+'</span></div>';
  }else{
    html+='<div style="font-size:18px;font-weight:900;color:#22c55e;margin:10px 0">¡Todas reveladas!</div>';
  }
  html+='<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px">';
  cardDeck.forEach(card=>{
    if(card.revealed){
      const face=card.type==='crown'?'👑':card.type==='skull'?'💀':'➖';
      const col=card.type==='crown'?'#22c55e':card.type==='skull'?'#e21b3c':'var(--wood)';
      html+='<div style="width:90px;height:130px;border-radius:12px;background:var(--card);border:2px solid '+col+';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px">';
      html+='<div style="font-size:40px">'+face+'</div>';
      if(card.takenBy)html+='<div style="font-size:11px;color:var(--dim);font-weight:700">'+tn(card.takenBy)+'</div>';
      html+='</div>';
    }else{
      const clickable=nextTeam!=null;
      html+='<button '+(clickable?'':'disabled')+' onclick="pickCard('+card.id+')" style="width:90px;height:130px;border-radius:12px;background:linear-gradient(135deg,#5d64a8,#33354a);border:2px solid var(--wood);cursor:'+(clickable?'pointer':'default')+';font-size:40px;color:#fff;opacity:'+(clickable?'1':'.6')+'">?</button>';
    }
  });
  html+='</div>';
  // results summary
  if(!nextTeam){
    html+='<div style="margin-top:14px;display:flex;flex-direction:column;gap:6px;max-width:340px;margin-left:auto;margin-right:auto">';
    cardDeck.filter(c=>c.takenBy).forEach(card=>{
      const r=card.type==='crown'?'👑 +3 casillas':card.type==='skull'?'💀 -5 casillas':'➖ sin efecto';
      const col=card.type==='crown'?'#22c55e':card.type==='skull'?'#e21b3c':'var(--dim)';
      html+='<div style="display:flex;justify-content:space-between;background:var(--card);border-radius:10px;padding:8px 14px"><span style="font-weight:700">'+tn(card.takenBy)+'</span><span style="font-weight:900;color:'+col+'">'+r+'</span></div>';
    });
    html+='</div>';
  }
  html+='</div>';
  mp.innerHTML=html;
  addBackToChallengeBtn();
  addNextRoundBtn();
}
function pickCard(id){
  const teamsIn=teams();
  const pending=teamsIn.filter(t=>!Object.values(cardPicks).includes(t));
  const nextTeam=pending[0];
  if(!nextTeam)return;
  const card=cardDeck.find(c=>c.id===id);
  if(!card||card.revealed)return;
  card.revealed=true;card.takenBy=nextTeam;
  cardPicks[id]=nextTeam;
  if(card.type==='crown'||card.type==='skull')confetti();
  saveTV();
  renderCards();
}
function setupBanker(){
  bankOffer=2+Math.floor(Math.random()*3); // safe deal: 2-4 casillas
  bankDecisions={};bankBoxes={};bankRevealed=false;
  pub({type:'bankOffer',offer:bankOffer});
}
function renderBanker(){
  const mp=document.getElementById('mainPanel');
  if(!mp||!lastCh||lastCh.ch.rt!=='banker')return;
  const teamsIn=teams();
  const tn=t=>{const d=teamDefs.find(x=>x.id===t);return d?d.name:'Equipo '+t;};
  let html='<div style="text-align:center"><div style="font-size:44px">💼</div>';
  html+='<div style="color:var(--cat-evento);font-size:14px;font-weight:900;letter-spacing:.12em;margin:6px 0">¡LA CAJA, LA CAJA!</div>';
  html+='<div style="font-size:20px;font-weight:900;color:#fff;margin:12px 0">Trato del banquero: <span style="color:#22c55e">+'+bankOffer+' casillas</span> seguras</div>';
  html+='<div style="color:var(--dim);font-size:13px;margin-bottom:12px">...o abre la caja misteriosa 📦</div>';
  // each team's status
  html+='<div style="display:flex;flex-direction:column;gap:8px;max-width:360px;margin:0 auto">';
  teamsIn.forEach(t=>{
    const dec=bankDecisions[t];
    let right='';
    if(!dec)right='<span style="color:var(--dim);font-size:13px">decidiendo...</span>';
    else if(dec==='deal')right='<span style="color:#22c55e;font-weight:900">✓ Trato (+'+bankOffer+')</span>';
    else if(dec==='box'){
      if(bankRevealed&&bankBoxes[t]!=null){
        const v=bankBoxes[t];
        right='<span style="font-weight:900;color:'+(v>=0?'#22c55e':'#e21b3c')+'">📦 '+(v>=0?'+':'')+v+' casillas</span>';
      }else right='<span style="color:var(--gold);font-weight:900">📦 ¡La caja!</span>';
    }
    html+='<div style="display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--wood)"><span style="font-weight:700">'+tn(t)+'</span>'+right+'</div>';
  });
  html+='</div>';
  const allDecided=teamsIn.length&&teamsIn.every(t=>bankDecisions[t]);
  const anyBox=teamsIn.some(t=>bankDecisions[t]==='box');
  if(allDecided&&anyBox&&!bankRevealed){
    html+='<button class="btn btn-gold" style="margin-top:14px;width:100%;font-size:16px" onclick="bankReveal()">📦 ¡Abrir las cajas!</button>';
  }
  html+='</div>';
  mp.innerHTML=html;
  addBackToChallengeBtn();
  addNextRoundBtn();
}
function bankReveal(){
  const teamsIn=teams();
  const shuffled=[...BANK_BOXES].sort(()=>Math.random()-.5);
  let bi=0;
  teamsIn.forEach(t=>{if(bankDecisions[t]==='box'){bankBoxes[t]=shuffled[bi%shuffled.length];bi++;}});
  bankRevealed=true;confetti();saveTV();renderBanker();
}
function setupSongDuel(){
  const teamsIn=[lastCh.aT,lastCh.oT].filter(Boolean);
  songDuel={remaining:{},activeTeam:null,raf:null,lastTick:0,loser:null};
  teamsIn.forEach(t=>{songDuel.remaining[t]=90;});
}
function renderSongDuel(){
  const mp=document.getElementById('mainPanel');
  if(!mp||!lastCh||!['songword_duel','songtheme_duel'].includes(lastCh.ch.rt))return;
  const teamsIn=[lastCh.aT,lastCh.oT].filter(Boolean);
  const tn=t=>{const d=teamDefs.find(x=>x.id===t);return d?d.name:'Equipo '+t;};
  let html='<div style="text-align:center"><div style="font-size:44px">🎵</div>';
  html+='<div style="color:var(--cat-versus);font-size:14px;font-weight:900;letter-spacing:.12em;margin:6px 0">'+lastCh.ch.n.toUpperCase()+'</div>';
  html+='<div style="display:flex;gap:14px;justify-content:center;margin-top:14px;flex-wrap:wrap">';
  teamsIn.forEach(t=>{
    const r=Math.max(0,songDuel.remaining[t]);
    const isActive=songDuel.activeTeam===t;
    const danger=r<=15&&r>0;
    const dead=r<=0;
    html+='<div style="background:var(--card);border:3px solid '+(dead?'#666':isActive?'#22c55e':'var(--wood)')+';border-radius:16px;padding:18px 24px;min-width:160px">';
    html+='<div style="font-size:13px;font-weight:800;color:var(--dim)">'+tn(t)+'</div>';
    html+='<div style="font-size:42px;font-weight:900;color:'+(dead?'#666':danger?'#e21b3c':'#fff')+';margin:6px 0">'+r.toFixed(1)+'s</div>';
    if(dead)html+='<div style="color:#e21b3c;font-weight:900;font-size:13px">SIN TIEMPO</div>';
    else if(isActive)html+='<div style="color:#22c55e;font-weight:900;font-size:13px">⏵ EN TURNO</div>';
    else html+='<button class="btn" style="padding:8px 16px;font-size:13px" onclick="songDuelSetTurn(\''+t+'\')" '+(songDuel.loser?'disabled':'')+'>Pasarle el turno</button>';
    html+='</div>';
  });
  html+='</div>';
  if(!songDuel.loser){
    if(songDuel.activeTeam){
      html+='<button class="btn btn-gold" style="margin-top:16px;width:100%;font-size:15px" onclick="songDuelPause()">⏸ Pausar (cambiar turno)</button>';
    }else{
      html+='<div style="color:var(--dim);font-size:13px;margin-top:12px">Elige qué equipo empieza</div>';
    }
  }else{
    const winner=teamsIn.find(t=>t!==songDuel.loser);
    html+='<div style="font-size:20px;font-weight:900;color:#22c55e;margin-top:16px">🏆 Gana '+tn(winner)+'</div>';
  }
  html+='</div>';
  mp.innerHTML=html;
  addBackToChallengeBtn();
  addNextRoundBtn();
}
function songDuelSetTurn(t){
  if(songDuel.loser)return;
  songDuel.activeTeam=t;
  songDuel.lastTick=Date.now();
  songDuelTick();
}
function songDuelPause(){
  songDuel.activeTeam=null;
  if(songDuel.raf)cancelAnimationFrame(songDuel.raf);
  renderSongDuel();
}
function songDuelTick(){
  if(!songDuel.activeTeam)return;
  const now=Date.now();
  const dt=(now-songDuel.lastTick)/1000;
  songDuel.lastTick=now;
  songDuel.remaining[songDuel.activeTeam]=Math.max(0,songDuel.remaining[songDuel.activeTeam]-dt);
  if(songDuel.remaining[songDuel.activeTeam]<=0){
    songDuel.loser=songDuel.activeTeam;
    songDuel.activeTeam=null;
    confetti();
    renderSongDuel();
    return;
  }
  renderSongDuel();
  songDuel.raf=requestAnimationFrame(songDuelTick);
}
function tc(t){const i='ABCDEFGH'.indexOf(t);return TC[i>=0?i:0];}

// ════════ NAVEGACIÓN CON MANDO DE TV ════════
let navFocus=-1;
function navItems(){
  // All clickable elements currently visible on the active screen
  const active=document.querySelector('.screen.active')||document.body;
  const sel='button:not([disabled]), input[type=text], .cat-card, [onclick]';
  return [...active.querySelectorAll(sel)].filter(el=>{
    const r=el.getBoundingClientRect();
    return r.width>0&&r.height>0&&el.offsetParent!==null;
  });
}
function navClear(){document.querySelectorAll('.tv-focus').forEach(e=>e.classList.remove('tv-focus'));}
function navSet(i){
  const items=navItems();
  if(!items.length){navFocus=-1;return;}
  navClear();
  navFocus=(i+items.length)%items.length;
  const el=items[navFocus];
  el.classList.add('tv-focus');
  el.scrollIntoView({block:'center',behavior:'smooth'});
}
function navMove(dir){
  const items=navItems();
  if(!items.length)return;
  if(navFocus<0){navSet(0);return;}
  // For simplicity move sequentially; works well for vertical button stacks on TV
  navSet(navFocus+dir);
}
function navActivate(){
  const items=navItems();
  if(navFocus<0||navFocus>=items.length){navSet(0);return;}
  const el=items[navFocus];
  if(el.tagName==='INPUT'){el.focus();return;}
  el.click();
  // After an action the screen may change; reset focus to first item shortly after
  setTimeout(()=>{navClear();navFocus=-1;},100);
}
document.addEventListener('keydown',e=>{
  // Don't hijack typing in a text field
  if(document.activeElement&&document.activeElement.tagName==='INPUT'){
    if(e.key==='Escape')document.activeElement.blur();
    return;
  }
  switch(e.key){
    case'ArrowDown':case'ArrowRight':e.preventDefault();navMove(1);break;
    case'ArrowUp':case'ArrowLeft':e.preventDefault();navMove(-1);break;
    case'Enter':e.preventDefault();navActivate();break;
    // Direct shortcuts (also work without focus navigation)
    case' ':{ // Space = start/pause the challenge timer if present
      e.preventDefault();
      if(typeof chTimerRunning!=='undefined'){
        if(chTimerRunning)chTimerPause();else chTimerStart();
      }
      break;}
    case'n':case'N':{ // N = siguiente casilla
      const b=[...document.querySelectorAll('button')].find(x=>x.textContent.includes('Siguiente casilla'));
      if(b)b.click();
      break;}
    case'Backspace':case'Escape':{ // Back = volver en el wizard
      e.preventDefault();
      const back=[...document.querySelectorAll('button')].find(x=>/volver|atrás|←/i.test(x.textContent));
      if(back)back.click();
      break;}
    // ── Teclas de color del mando: elegir categoría directamente ──
    case'ColorF0Red':case'r':case'R':tvColorKey('versus');break;
    case'ColorF1Green':case'g':case'G':tvColorKey('evento');break;
    case'ColorF2Yellow':case'y':case'Y':tvColorKey('musical');break;
    case'ColorF3Blue':case'b':case'B':tvColorKey('minijuego');break;
  }
  // ── Teclas numéricas: elegir la opción N de la pantalla actual (equipos, etc.) ──
  if(/^[1-9]$/.test(e.key)){
    const idx=parseInt(e.key)-1;
    const items=navItems();
    if(items[idx]){navSet(idx);items[idx].click();setTimeout(()=>{navClear();navFocus=-1;},100);}
  }
});
function tvColorKey(cat){
  // Only act when we're on the category-selection screen of the wizard
  if(typeof wState!=='undefined'&&wState==='cat'&&typeof wPickCat==='function'){
    wPickCat(cat);
  }
}
// Show a small help hint
window.addEventListener('DOMContentLoaded',()=>{
  setTimeout(()=>{
    if(document.getElementById('tvHelp'))return;
    const h=document.createElement('div');
    h.id='tvHelp';
    h.innerHTML='<b>Mando:</b> ↑↓ mover · OK elegir · ESPACIO crono · N siguiente<br><span style="color:#e74c3c">●</span> Versus · <span style="color:#2ecc71">●</span> Evento · <span style="color:#f1c40f">●</span> Musical · <span style="color:#3498db">●</span> Minijuego';
    document.body.appendChild(h);
  },800);
});
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');navClear();navFocus=-1;}

  });
})();
